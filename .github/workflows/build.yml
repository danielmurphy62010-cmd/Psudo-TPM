name: Build Psudo-TPM

on:
  push:
    paths:
      - 'Rust/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Rust/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: Rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust -> target

      - name: Compile and run tests
        run: cargo test --all-targets

      - name: Build optimized executable
        run: cargo build --release --bin psudo-tpm

      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: psudo-tpm-linux-x86_64
          path: Rust/target/release/psudo-tpm
          if-no-files-found: error

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: psudo-tpm-windows-x86_64
          path: Rust/target/release/psudo-tpm.exe
          if-no-files-found: error