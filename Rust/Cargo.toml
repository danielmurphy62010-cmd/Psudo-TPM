[package]
name = "psudo-tpm"
version = "0.2.0"
edition = "2021"
description = "Process-scoped encrypted local key vault"
license = "GPL-3.0-only"

[lib]
name = "psudo_tpm"
crate-type = ["rlib"]

[[bin]]
name = "psudo-tpm"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
chacha20poly1305 = "0.10.1"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", features = ["v1"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
